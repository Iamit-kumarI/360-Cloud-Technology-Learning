<template>
    <lightning-card title="Open Opportunities">
        <div class="slds-p-around_medium">
            <lightning-combobox
                label="Stage"
                value={selectedStage}
                options={stageOptions}
                onchange={handleStageChange}
            >
            </lightning-combobox>
            <lightning-input
                type="Date"
                label="New Closed Date"
                value={selectedCloseDate}
                onchange={handleDateChange}
            >
            </lightning-input>
            <lightning-button
                label="Update Opportunities"
                variant="brand"
                class="slds-m-top_medium"
                onclick={handleUpdate}
            >
            </lightning-button>
        </div>
        <template if:true={hasOpportunities}>
            <lightning-datatable
                key-field="Id"
                data={opportunities}
                columns={columns}
                onrowselection={handleRowSelection}
            >
            </lightning-datatable>
        </template>
        <template if:false={hasOpportunities}>
            <p class="slds-p-around_medium">
                No Open Opportunities found.
            </p>
        </template>
    </lightning-card>
</template>
